<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Ahmad Ali</title>
    <link rel="stylesheet" href="../design/stylesheets/style.css">
    <!-- JavaScript Validation Script -->
    <script>
        function validateForm(event) {
            // Prevent form submission by default to check validation
            event.preventDefault();

            const fullName = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value.trim();
            const comments = document.getElementById('comments').value.trim();

            // Check if any field is empty
            if (fullName === "" || email === "" || country === "" || comments === "") {
                alert("Error: All fields must be filled out before submission.");
                return false;
            }

            // Display simple alert message confirming successful submission
            alert("Thank you! Your form was submitted successfully.");
            
            // Optionally reset the form
            document.getElementById('contactForm').reset();
            return true;
        }
    </script>
</head>
<body>

    <!-- Simple Navigation Menu -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html" class="active">Contact Me</a></li>
        </ul>
    </nav>

    <header class="profile-header">
        <h1>Contact Me</h1>
        <p class="subtitle">Feel free to drop a message using the form below.</p>
    </header>

    <main class="form-container">
        <!-- Web Form -->
        <form id="contactForm" onsubmit="validateForm(event)">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="country">Country:</label>
                <input type="text" id="country" name="country">
            </div>

            <div class="form-group">
                <label for="comments">Comments / Message:</label>
                <textarea id="comments" name="comments" rows="5"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ahmad Ali. Jordan University of Science and Technology.</p>
    </footer>

</body>
</html>
